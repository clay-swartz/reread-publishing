<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffaf2">
  <meta name="description" content="Discover Re:Read, an independent publisher bringing overlooked books back to life. Sign up for news about our first books.">
  <title>Introducing Re:Read — Books worth finding. Books worth keeping.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=IBM+Plex+Mono:wght@500&family=Special+Elite&family=Abril+Fatface&family=UnifrakturCook:wght@700&family=Cinzel+Decorative:wght@700&family=Bangers&family=Bebas+Neue&family=Bodoni+Moda:opsz,wght@6..96,700&family=Josefin+Sans:wght@700&family=Ultra&family=Permanent+Marker&family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/system/tokens.css">
  <link rel="stylesheet" href="/src/system/components.css">
  <link rel="stylesheet" href="/src/system/announcement.css">
  <link rel="stylesheet" href="/src/system/hero-acquisition.css">
  <link rel="stylesheet" href="/src/system/email-capture.css">
  <link rel="stylesheet" href="/src/system/review-pages.css">
</head>
<body>
<a href="#content" class="rr-skip">Skip to content</a>
<header class="rr-header">
  <a class="rr-wordmark" href="/" aria-label="Re:Read home"><span>Re</span><span class="rr-wordmark__colon">:</span><span class="rr-wordmark__part"><span class="rr-wordmark__spacer" aria-hidden="true">Read</span><span class="rr-wordmark__face">Read</span></span></a>
  <nav class="rr-header__nav" aria-label="Main navigation"><a class="rr-header__link" href="/submissions/">Submissions</a></nav>
</header>
<main id="content">
  <div class="rr-top">
    <section class="rr-hero rr-hero--acquisition" aria-labelledby="hero-title">
      <div class="rr-hero__paper" aria-hidden="true"></div>
      <div class="rr-hero__inner rr-hero__layout">
        <div class="rr-hero__copy">
          <h1 id="hero-title" class="rr-hero__mission">Introducing <span class="rr-hero__brand">Re:Read</span>, an independent publisher hellbent on giving overlooked books a new life<span class="rr-hero__headline-punctuation">.</span></h1>
        </div>
        <div class="rr-hero__intake rr-hero__intake--newsletter" aria-labelledby="hero-newsletter-title">
          <h2 id="hero-newsletter-title">Sign up to hear about what's coming next.</h2>
          <form id="newsletterForm" class="rr-home__form" aria-label="Sign up for Re:Read news">
            <label class="rr-visually-hidden" for="heroEmail">Email address</label>
            <input type="email" name="email" id="heroEmail" autocomplete="email" placeholder="Your email address" required>
            <button type="submit">Keep me posted</button>
            <p class="rr-home__form-note">Preview only. Signups aren't being saved yet.</p>
            <p class="rr-home__form-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>

  </div>


</main>
<footer class="rr-footer rr-footer--compact">
  <div class="rr-footer__inner">
    <span class="rr-footer__name">Re:Read<span class="rr-footer__period">.</span></span>
    <nav class="rr-footer__nav" aria-label="Footer navigation"><a href="/submissions/">Submissions</a><a href="/about/">About</a></nav>
  </div>
</footer>
<script type="module" src="/src/system/site.js"></script>
</body>
</html>
