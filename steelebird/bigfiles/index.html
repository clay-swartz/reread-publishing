<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#fffaf2"><title>Attach large files — Steelebird</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/steelebird/steelebird.css"><style>
main{min-height:calc(100vh - 76px);display:flex;align-items:center;justify-content:center;padding:60px 22px 100px;background:#fffaf2}
.upload-wrap{width:min(100%,560px)}h1{font-family:"Libre Baskerville",Georgia,serif;font-size:clamp(38px,5vw,59px);letter-spacing:-.06em;line-height:1.15;margin:0 0 40px;color:#171c29}
form{display:grid;gap:22px}.field{display:grid;gap:8px}label{font-size:14px;font-weight:600}input[type=email]{background:#fff;border:1px solid #bbc0ce;border-radius:3px;padding:17px;font:inherit;width:100%}
input[type=file]{display:block;width:100%;padding:16px;background:#fff;border:1px solid #bbc0ce;border-radius:3px;font:inherit;font-size:14px}
button{font-family:inherit;font-size:15px;border:0;color:white;background:#244ddb;padding:17px 25px;border-radius:3px;font-weight:700}button:disabled{opacity:.65;cursor:not-allowed}
progress{width:100%;height:9px;accent-color:#244ddb}.hint{font-size:13px;color:#5a6070;margin:3px 0 0}.status{font-size:14px;line-height:1.6;margin:0}.status:empty{display:none}.sb-home{display:inline-flex}
</style></head><body><header class="sb-header"><a href="/" class="sb-home" aria-label="Steelebird home"><span class="sb-logo sb-wordmark sb-wordmark--solid">Steelebird</span></a></header><main><div class="upload-wrap"><h1>Attach large files</h1><form id="largefile-form"><div class="field"><label for="sender-email">Email</label><input id="sender-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required></div><div class="field"><label for="upload-file">Attach</label><input id="upload-file" name="file" type="file" required><p class="hint">Up to 50 MB. Keep this page open until your upload finishes.</p></div><input name="website" style="display:none" tabindex="-1" autocomplete="off"><button id="send-button" type="submit">Send file</button><progress id="upload-progress" value="0" max="100" hidden></progress><p class="status" id="upload-status" role="status" aria-live="polite"></p></form></div></main>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js"></script>
<script>
const endpoint="https://uymwsivcgtapckzjoywk.supabase.co/functions/v1/steelebird-largefile-intake";
const form=document.getElementById("largefile-form"),button=document.getElementById("send-button"),status=document.getElementById("upload-status"),progress=document.getElementById("upload-progress");
async function request(data){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const body=await r.json();if(!r.ok)throw new Error(body.error||"Upload service unavailable.");return body}
form.addEventListener("submit",async e=>{
 e.preventDefault();if(button.disabled)return;
 const file=document.getElementById("upload-file").files[0],email=document.getElementById("sender-email").value.trim();
 if(!file||!email)return;
 if(file.size>50*1024*1024){status.textContent="Please choose a file smaller than 50 MB.";return}
 if(!window.tus?.Upload){status.textContent="The upload library couldn't load. Please reload the page.";return}
 button.disabled=true;status.textContent="Preparing upload…";progress.hidden=false;progress.value=0;
 try{
  const ready=await request({action:"start",email,filename:file.name,size:file.size,website:form.website?.value||""});
  await new Promise((resolve,reject)=>{
   const upload=new tus.Upload(file,{
    endpoint:"https://uymwsivcgtapckzjoywk.storage.supabase.co/storage/v1/upload/resumable",
    chunkSize:6*1024*1024,retryDelays:[0,3000,5000,10000,20000],
    headers:{"x-signature":ready.upload_token,"Authorization":"Bearer "+ready.anon_key},
    metadata:{bucketName:ready.bucket,objectName:ready.path,contentType:file.type||"application/octet-stream",cacheControl:"3600"},
    uploadDataDuringCreation:true,removeFingerprintOnSuccess:true,
    onProgress:(done,total)=>{const pct=Math.round(done/total*100);progress.value=pct;status.textContent="Uploading… "+pct+"%";},
    onSuccess:resolve,onError:reject
   });upload.start();
  });
  await request({action:"complete",id:ready.id,secret:ready.secret});
  status.textContent="Thanks! Your file has been received.";progress.value=100;form.reset();
 }catch(err){status.textContent=err.message||"Upload failed. Please try again."}finally{button.disabled=false}
});
</script></body></html>
