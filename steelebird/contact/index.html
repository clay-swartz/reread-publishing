<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fffaf2"><meta name="description" content="Steelebird is an independent publishing house for unexpected discoveries and books worth finding."><title>Contact — Steelebird</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/steelebird/steelebird.css"><link rel="stylesheet" href="/steelebird/components.css"></head><body ><a class="sb-skip" href="#content">Skip to content</a><header class="sb-header sb-launch-header"><a href="/" class="sb-home" aria-label="Steelebird home"><span class="sb-logo sb-wordmark" aria-label="Steelebird"><span class="sb-wordmark-first">Steele</span><span class="sb-wordmark-last">bird</span></span></a></header>
<main id="content"><section class="sb-hero sb-interior-hero sb-component-hero sb-component-hero--interior sb-surface--ebony"><div class="sb-shell sb-hero-wrap"><div><h1>Want to <em>talk books?</em></h1></div></div></section>
<section class="sb-shell sb-contact-layout sb-contact-layout--interior"><div class="sb-contact-intro"><h2>Start a conversation.</h2><p>We welcome inquiries from authors, agents, estates, rights holders, booksellers, media, and publishing partners.</p><p>Submitting a manuscript? Take a look at our <a href="/submissions/">Submissions page</a>.</p></div>
