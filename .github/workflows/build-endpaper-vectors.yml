name: Build crisp endpaper vectors
on:
  push:
    paths:
      - .github/workflows/build-endpaper-vectors.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vectorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy vtracer
      - name: Trace print shapes into scalable SVG assets
        run: |
          python - <<'PY'
          import vtracer
          from PIL import Image, ImageOps
          from pathlib import Path
          folder=Path('public/endpapers')
          for name in ('sage','starburst','sepia','blush','birds'):
              src=folder/(name+'.png')
              out=folder/(name+'.svg')
              img=Image.open(src).convert('RGB')
              # Recover distinct printed shapes as smooth vector outlines rather
              # than letting browsers interpolate the enlarged pixel previews.
              img=img.resize((480,600),Image.Resampling.LANCZOS)
              # Join opposing edges smoothly; these generated illustrations
              # were not actually seamless and created visible horizontal bands.
              import numpy as np, math
              a=np.array(img,dtype=np.float32)
              height,width=a.shape[:2]
              bx=int(width*.16)
              by=int(height*.16)
              orig=a.copy()
              for x in range(bx):
                  t=x/max(1,bx-1)
                  weight=.5+.5*math.sin(t*math.pi/2)
                  left=orig[:,x,:]
                  right=orig[:,width-1-x,:]
                  a[:,x,:]=weight*left+(1-weight)*right
                  a[:,width-1-x,:]=weight*right+(1-weight)*left
              orig=a.copy()
              for y in range(by):
                  t=y/max(1,by-1)
                  weight=.5+.5*math.sin(t*math.pi/2)
                  top=orig[y,:,:]
                  bottom=orig[height-1-y,:,:]
                  a[y,:,:]=weight*top+(1-weight)*bottom
                  a[height-1-y,:,:]=weight*bottom+(1-weight)*top
              img=Image.fromarray(np.uint8(np.clip(a,0,255)))
              interim=folder/('_trace_'+name+'.png')
              img.save(interim)
              vtracer.convert_image_to_svg_py(
                str(interim), str(out), colormode='color',
                hierarchical='stacked', mode='spline',
                filter_speckle=5, color_precision=5,
                layer_difference=18, corner_threshold=60,
                length_threshold=4.0, max_iterations=10,
                splice_threshold=45, path_precision=2)
              interim.unlink()
              print(name,out.stat().st_size,flush=True)
          PY
      - name: Commit vector artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/endpapers/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Add resolution-independent traced endpaper patterns"
            git push
          fi
