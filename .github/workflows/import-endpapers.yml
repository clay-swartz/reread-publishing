name: Import ReRead endpapers
on:
  push:
    paths:
      - .github/workflows/import-endpapers.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved endpapers and commit assets
        shell: bash
        run: |
          mkdir -p public/endpapers
          echo 'Fetching sage original...'
          if ! curl --fail --location --silent --show-error --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:1402/quality:100/uri:ifs%3A%2F%2FM%2F58d09f28-5296-4aa5-8ab9-24a902a4371a/watermark:F/width:1122?csig=AAAAAAAAAAAAAAAAAAAAANjZ0bMz30oB0K0JOJCWXZRHaRGY2OQ9jffgox1MnoRM&exp=1792805125&osig=AAAAAAAAAAAAAAAAAAAAAEpXHnFmrzbz9njyoXUvrQvkCYLxV6ge8B4BjBPF1lyC&signer=media-rpc&token=AAIAAU0AJDU4ZDA5ZjI4LTUyOTYtNGFhNS04YWI5LTI0YTkwMmE0MzcxYQAAAAABoWuDO4gtHYAbfYY7Mh_PYj1tYxNBZkQ_kGsW60sNNPg0TXOYkw&x-canva-quality=thumbnail' -o public/endpapers/sage.png; then
           echo 'Falling back to signed preview for sage'
           curl --fail --location --silent --show-error --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F58d09f28-5296-4aa5-8ab9-24a902a4371a/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAANjZ0bMz30oB0K0JOJCWXZRHaRGY2OQ9jffgox1MnoRM&exp=1792805125&osig=AAAAAAAAAAAAAAAAAAAAAEpXHnFmrzbz9njyoXUvrQvkCYLxV6ge8B4BjBPF1lyC&signer=media-rpc&token=AAIAAU0AJDU4ZDA5ZjI4LTUyOTYtNGFhNS04YWI5LTI0YTkwMmE0MzcxYQAAAAABoWuDO4gtHYAbfYY7Mh_PYj1tYxNBZkQ_kGsW60sNNPg0TXOYkw&x-canva-quality=thumbnail' -o public/endpapers/sage.png
          fi
          file public/endpapers/sage.png
          echo 'Fetching starburst original...'
          if ! curl --fail --location --silent --show-error --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:1402/quality:100/uri:ifs%3A%2F%2FM%2Fdf71157d-3999-4080-ab89-5e5b810ce4bd/watermark:F/width:1122?csig=AAAAAAAAAAAAAAAAAAAAAPWSqpBt6GDLXmNGylDcr6773wrzsm5RpukE4i59xAdF&exp=1792804159&osig=AAAAAAAAAAAAAAAAAAAAALeX37H286-2ZDcHwCDndG-bZissrIgZ3Zsc621V86dH&signer=media-rpc&token=AAIAAU0AJGRmNzExNTdkLTM5OTktNDA4MC1hYjg5LTVlNWI4MTBjZTRiZAAAAAABoWt0fhi_bfUqfoRYjIpjJmkRBGqSS5l9ngpE7PWpzflvJv1zxg&x-canva-quality=thumbnail' -o public/endpapers/starburst.png; then
