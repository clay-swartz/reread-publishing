           echo 'Falling back to signed preview for birds'
           curl --fail --location --silent --show-error --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fe3032d91-f896-406d-a270-34e67f0deba5/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAACh8hI9G3IHS7jQxEfgfQiWEO7awm3lJz75nHMYJ7VUD&exp=1792804547&osig=AAAAAAAAAAAAAAAAAAAAAA-x-2mIHBa3Y8lojbyf0k3eQWiLolP18C5sIpav3ZBL&signer=media-rpc&token=AAIAAU0AJGUzMDMyZDkxLWY4OTYtNDA2ZC1hMjcwLTM0ZTY3ZjBkZWJhNQAAAAABoWt6abj5Kbsx2lyWBeeIiTpbnCmBhkImVJo83WiMTwv9gDXQgQ&x-canva-quality=thumbnail' -o public/endpapers/birds.png
          fi
          file public/endpapers/birds.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/endpapers/
          if ! git diff --cached --quiet; then git commit -m "Add Re:Read endpaper artwork"; git push; fi
